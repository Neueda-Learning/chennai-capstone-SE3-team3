spring.application.name=backend

# Server
server.port=8080
server.error.whitelabel.enabled=false

# Surface routing errors as exceptions so the API error envelope is always returned.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT Secret (test value)
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-testing

# Logging
logging.level.org.mybatis=WARN
logging.level.org.springframework.jdbc=WARN
