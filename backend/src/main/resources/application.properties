spring.application.name=backend

# Server
server.port=8080
server.error.whitelabel.enabled=false

# Surface routing errors as exceptions so the API error envelope is always returned.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities


# JWT Secret
jwt.secret=${JWT_SECRET}

# Health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true


# Logging
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG